<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>SecretShop — News &amp; Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/nav.css?v=20261008">
    <link rel="stylesheet" href="css/news.css">
    <link rel="stylesheet" href="css/pages/news.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  </head>
  <body>
    <div id="main-nav-container"></div>

    <main class="container">
      <div id="news-page" class="page">
        <div class="card nw-card">
          <div class="card-corner tl"></div><div class="card-corner tr"></div>
          <div class="card-corner bl"></div><div class="card-corner br"></div>

          <div class="nw-head">
            <div class="section-label">News &amp; Results</div>
            <button type="button" class="news-add" id="nwAdd">+ Add card</button>
          </div>
          <p class="nw-intro">Every result card from the SecretLeague bot, newest first. Open one for the full card, match links and highlights.</p>

          <div class="nw-filters" role="group" aria-label="Filter by division">
            <button type="button" class="nw-filter is-on" data-div="">All</button>
            <button type="button" class="nw-filter" data-div="upper">Upper</button>
            <button type="button" class="nw-filter" data-div="mid">Mid</button>
            <button type="button" class="nw-filter" data-div="lower">Lower</button>
          </div>

          <ul class="news-list nw-grid" id="nwGrid" aria-live="polite"></ul>
          <p class="news-empty nw-status" id="nwStatus">Loading cards…</p>
          <button type="button" class="nw-more" id="nwMore" hidden>Load more</button>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <span class="site-footer__copy">// SecretShop &middot; Community &middot; Dota 2 //</span>
      <div class="site-footer__socials">
        <a href="https://www.twitch.tv/secretleaguedota" target="_blank" rel="noopener" aria-label="Twitch" class="footer-social-link">
          <img src="assets/socialimages/twitch.png" alt="Twitch" class="footer-social-icon">
        </a>
        <a href="https://www.youtube.com/@SecretShopDOTA" target="_blank" rel="noopener" aria-label="YouTube" class="footer-social-link">
          <img src="assets/socialimages/youtube.png" alt="YouTube" class="footer-social-icon">
        </a>
        <a href="https://www.instagram.com/secretleaguedota/" target="_blank" rel="noopener" aria-label="Instagram" class="footer-social-link">
          <img src="assets/socialimages/instagram.png" alt="Instagram" class="footer-social-icon">
        </a>
        <a href="https://www.tiktok.com/@secretshopdota" target="_blank" rel="noopener" aria-label="TikTok" class="footer-social-link">
          <img src="assets/socialimages/tik-tok.png" alt="TikTok" class="footer-social-icon">
        </a>
        <a href="https://x.com/SecretShopDOTA" target="_blank" rel="noopener" aria-label="X / Twitter" class="footer-social-link">
          <img src="assets/socialimages/twitter.png" alt="X" class="footer-social-icon">
        </a>
      </div>
      <a href="mailto:secretleaguedota@gmail.com" class="site-footer__email">secretleaguedota@gmail.com</a>
    </footer>

    <script type="module" src="js/nav.js?v=20261008"></script>
    <script type="module" src="js/news.js?v=20261008"></script>
  </body>
</html>
